variables:
  RUBY_VERSION: 3.2.2

workflow:
  rules:
    - if: $CI_COMMIT_TAG

build-and-release:
  stage: build
  image:  ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/ruby:$RUBY_VERSION
  before_script:
    - apt-get update -y
    - apt-get install -y rsync
  script:
    - bundle install
    - pod lib lint --allow-warnings --allow-root
    - |
      AUTH=$(printf 'x-access-token:%s' "$SPEC_REPO_TOKEN" | base64 -w0)
      git config --global http.https://github.com/primer-io/primer-sdk-ios-specs.git.extraheader "AUTHORIZATION: basic $AUTH"
      git config --global user.name "$GITLAB_USER_NAME"
      git config --global user.email "$GITLAB_USER_EMAIL"
    - pod repo add primer-sdk-ios-specs https://github.com/primer-io/primer-sdk-ios-specs.git --allow-root
    - pod repo push primer-sdk-ios-specs --allow-root --allow-warnings --use-json --sources=primer-sdk-ios-specs,https://cdn.cocoapods.org/
    # CocoaPods trunk accepts no new versions from 2 Dec 2026.
    - if [ "$(date -u +%Y%m%d)" -lt 20261202 ]; then pod trunk push --allow-root; fi
  when: manual
  environment: production
